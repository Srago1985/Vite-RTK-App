services:
  backend:
    image: mihanik999/forum-backend
    build:
      context: ../../../Backend/NodeJS/apps/forum
      dockerfile: Dockerfile
    env_file:
      - ../../../Backend/NodeJS/apps/forum/.env
    environment:
      PORT: 8080
      USER_ACCOUNT_BASE_URL: http://localhost:8080/account
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: mihanik999/forum-frontend
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
